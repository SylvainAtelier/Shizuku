plugins {
    id("idea")
}

idea.module {
    excludeDirs += file('out')
}

subprojects {
    plugins.withId("com.android.base") {
        android {
            compileSdk = 36
            buildToolsVersion = "36.0.0"
            ndkVersion = "29.0.13113456"
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

apply from: 'api/manifest.gradle'
def gitCommitId = 'git rev-parse --short HEAD'.execute([], project.rootDir).text.trim()
def gitCommitCount = Integer.parseInt('git rev-list --count HEAD'.execute([], project.rootDir).text.trim())
def baseVersionName = "${api_version_major}.6.0"
// release.yml 用 -PversionName 注入 tag 算出的版本号；deploy-debug.ps1 用 -PversionCode
// 注入「设备现装 + 1」。不传就走提交数，与上游一致。
ext {
    versionCode = providers.gradleProperty('versionCode').map { it.toInteger() }.getOrElse(gitCommitCount)
    versionName = providers.gradleProperty('versionName').getOrElse("${baseVersionName}.r${gitCommitCount}.${gitCommitId}")
}
